# The custom build command prints `node --version`; if Oryx prepared the
# environment before running CUSTOM_BUILD_COMMAND, the build log will show this
# exact version (v22.x).
platform: nodejs
platformVersion: "22"
buildCommand: "node --version && npm ci && npm run build"
autoDeploy: true

run:
  port: 8080
  startCommand: "node server.js"
